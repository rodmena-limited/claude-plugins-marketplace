# Publish @rodmena/agentbus-opencode to npm with PROVENANCE via OIDC trusted
# publishing — no long-lived token in CI.
#
# ONE-TIME SETUP (operator, on npmjs.com — the only manual step):
#   package @rodmena/agentbus-opencode -> Settings -> Trusted publishers ->
#   GitHub Actions: repository rodmena-limited/claude-plugins-marketplace,
#   workflow publish-opencode.yml, environment (leave empty).
# Until that click exists, this workflow fails at `npm publish` with E404/EOTP —
# by design: there is no token fallback here, because a fallback secret would
# quietly become the real mechanism.
#
# Trigger: push a tag `opencode-vX.Y.Z` matching the package.json version.
name: publish-opencode

on:
  push:
    tags:
      - "opencode-v*"

permissions:
  contents: read
  id-token: write # OIDC — this IS the credential

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/agentbus/opencode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: tag must match package.json version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#opencode-v}"
          if [ "$pkg" != "$tag" ]; then
            echo "tag $tag != package.json $pkg — refusing to publish a mismatch"
            exit 1
          fi
      - name: publish with provenance
        run: npm publish --provenance --access public
      - name: verify the SERVED artifact, not the exit code
        run: |
          sleep 20
          served="$(npm view @rodmena/agentbus-opencode@${GITHUB_REF_NAME#opencode-v} version 2>/dev/null || true)"
          if [ "$served" != "${GITHUB_REF_NAME#opencode-v}" ]; then
            echo "registry does not serve ${GITHUB_REF_NAME#opencode-v} yet (got '$served')"
            exit 1
          fi
          echo "registry serves $served"
